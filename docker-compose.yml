name: ${COMPOSE_PROJECT_NAME:-voice-vault}

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16
    logging: *default-logging
    mem_limit: 256m
    memswap_limit: 256m
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - default
      - shared
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data
      - ./volumes/backups:/backups
      - ./scripts/db-backup.sh:/db-backup.sh:ro
    # Backup job, run by Ofelia (callisto-services) inside this container. The job name
    # carries the Compose project name, so jobs of several projects never collide.
    labels:
      - "ofelia.enabled=true"
      - "ofelia.job-exec.backup-${COMPOSE_PROJECT_NAME:-voice-vault}.schedule=${BACKUP_SCHEDULE:-0 0 */4 * * *}"
      - "ofelia.job-exec.backup-${COMPOSE_PROJECT_NAME:-voice-vault}.command=/bin/sh /db-backup.sh"
      - "ofelia.job-exec.backup-${COMPOSE_PROJECT_NAME:-voice-vault}.user=${HOST_UID:-1000}:${HOST_GID:-1000}"
    restart: unless-stopped

  app:
    image: ${COMPOSE_PROJECT_NAME:-voice-vault}-app
    build:
      context: ./app
      args:
        APP_VERSION: ${APP_VERSION:-0.0}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    logging: *default-logging
    mem_limit: 512m
    memswap_limit: 512m
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      TZ: ${TZ:-Europe/Berlin}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PLAUD_TOKEN: ${PLAUD_TOKEN:-}
      PLAUD_REFRESH_TOKEN: ${PLAUD_REFRESH_TOKEN:-}
      PLAUD_API_BASE: ${PLAUD_API_BASE:-https://api-euc1.plaud.ai}
      IMPORT_INTERVAL_MINUTES: ${IMPORT_INTERVAL_MINUTES:-10}
      MIN_AGE_MINUTES: ${MIN_AGE_MINUTES:-720}
      STABILITY_MINUTES: ${STABILITY_MINUTES:-10}
      PERMANENT_DELETE_AFTER_HOURS: ${PERMANENT_DELETE_AFTER_HOURS:-12}
      PLAUD_DELETE_ENABLED: ${PLAUD_DELETE_ENABLED:-false}
      STORE_AUDIO: ${STORE_AUDIO:-false}
      TOKEN_WARN_DAYS: ${TOKEN_WARN_DAYS:-5}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_TO: ${MAIL_TO:-}
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Web UI (REQ-002): same image as app, database access only, no Plaud credentials.
  # Bound to loopback; reach it through the SSH tunnel of callisto-services.
  web:
    image: ${COMPOSE_PROJECT_NAME:-voice-vault}-app
    pull_policy: never
    command: ["uvicorn", "webapp:app", "--host", "0.0.0.0", "--port", "8000"]
    logging: *default-logging
    mem_limit: 256m
    memswap_limit: 256m
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      TZ: ${TZ:-Europe/Berlin}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      STABILITY_MINUTES: ${STABILITY_MINUTES:-10}
      MIN_AGE_MINUTES: ${MIN_AGE_MINUTES:-720}
      PERMANENT_DELETE_AFTER_HOURS: ${PERMANENT_DELETE_AFTER_HOURS:-12}
      PLAUD_DELETE_ENABLED: ${PLAUD_DELETE_ENABLED:-false}
      UI_LANG: ${UI_LANG:-de}
      UI_ALLOWED_HOSTS: ${UI_ALLOWED_HOSTS:-}
      UI_SECRET: ${UI_SECRET:-}
    ports:
      - "127.0.0.1:${PORTS_PREFIX}010:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # MCP server for Claude (REQ-003, D-011). Opt-in: set COMPOSE_PROFILES=mcp and MCP_TOKENS in .env.
  # Own port, read-only tools, bearer token on every request. Put TLS and a rate limit in the
  # reverse proxy; the proxy forwards to 127.0.0.1:${PORTS_PREFIX}020.
  mcp:
    profiles: ["mcp"]
    image: ${COMPOSE_PROJECT_NAME:-voice-vault}-app
    pull_policy: never
    command: ["uvicorn", "mcp_server:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    logging: *default-logging
    mem_limit: 256m
    memswap_limit: 256m
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      TZ: ${TZ:-Europe/Berlin}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      STABILITY_MINUTES: ${STABILITY_MINUTES:-10}
      MCP_TOKENS: ${MCP_TOKENS:-}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-}
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-}
      MCP_OAUTH_CLIENT_ID: ${MCP_OAUTH_CLIENT_ID:-}
      MCP_OAUTH_CLIENT_SECRET: ${MCP_OAUTH_CLIENT_SECRET:-}
      MCP_OAUTH_PASSWORD: ${MCP_OAUTH_PASSWORD:-}
      MCP_OAUTH_REDIRECT_URIS: ${MCP_OAUTH_REDIRECT_URIS:-https://claude.ai/api/mcp/auth_callback}
      UI_LANG: ${UI_LANG:-de}
    ports:
      - "127.0.0.1:${PORTS_PREFIX}020:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  app-tests:
    build:
      context: ./app
    logging: *default-logging
    mem_limit: 512m
    memswap_limit: 512m
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - ./app:/app
    environment:
      DATABASE_URL: "sqlite:///:memory:"
      TZ: ${TZ:-Europe/Berlin}
    command: /bin/sh -c "rm -fr .testmondata .pytest_cache; pytest --testmon --cov=. --cov-report=term || true; ptw . --delay 2 --testmon -v"
    restart: unless-stopped
    tty: true
    stdin_open: true

networks:
  shared:
    name: shared_net
    external: true
