name: Tests

# Fast feedback on every branch push and pull request. This is NOT the deploy
# gate: the deploy pipeline (deploy.yml) re-runs the suite on the server.

on:
  push:
    branches-ignore: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "sqlite:///:memory:"
      TZ: Europe/Berlin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        run: python -m pip install --quiet -r app/requirements.txt

      - name: Run tests and lint (ruff runs via pytest)
        working-directory: app
        run: pytest -p no:cacheprovider --cov=. --cov-report=term
