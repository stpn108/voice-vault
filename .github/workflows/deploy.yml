name: Deploy

# Runs on the self-hosted runner installed on the production server, after the
# version bump that follows every merge to main (whatever the bump's outcome;
# a failed bump must never block a deploy). It executes ./redeploy.sh in
# the server's deployment directory: tests in the real test container first,
# build and deploy only when they pass. The outcome is posted as a comment on
# the merged pull request (green: "deployed", red: the failing log), so the
# owner is told in the thread they last looked at. See SETUP.md.

on:
  workflow_run:
    workflows: ["Auto-bump version"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.repository.name != 'Zenplate' &&
      github.event.workflow_run.conclusion != 'cancelled'
    runs-on: [self-hosted, deploy]
    timeout-minutes: 30

    steps:
      - name: Pull main in the deployment directory
        working-directory: ${{ vars.DEPLOY_DIR }}
        run: |
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          echo "Deploying $(git rev-parse --short HEAD) v$(cat VERSION)"
          echo "APP_VERSION=$(cat VERSION)" >> "$GITHUB_ENV"

      - name: Test, build, deploy
        working-directory: ${{ vars.DEPLOY_DIR }}
        run: |
          set -o pipefail
          ./redeploy.sh 2>&1 | tee "$RUNNER_TEMP/deploy.log"

      - name: Report outcome on the merged pull request
        if: always()
        uses: actions/github-script@v7
        env:
          OUTCOME: ${{ job.status }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const fs = require('fs');
            const { OUTCOME, HEAD_SHA, RUN_URL, APP_VERSION, RUNNER_TEMP } = process.env;
            const ok = OUTCOME === 'success';

            let logTail = '';
            try {
              const lines = fs.readFileSync(`${RUNNER_TEMP}/deploy.log`, 'utf8').split('\n');
              logTail = lines.slice(-60).join('\n');
            } catch (e) {
              logTail = '(no deploy log: the job failed before redeploy.sh started)';
            }

            const body = ok
              ? `✅ **Deployed v${APP_VERSION || '?'}** — this change is live.\n\n[Deploy log](${RUN_URL})`
              : `❌ **Deployment failed — the previous version is still running, nothing was changed on the server.**\n\n` +
                `Copy the block below to Claude.\n\n[Full log](${RUN_URL})\n\n` +
                '```\n' + logTail + '\n```';

            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner, repo: context.repo.repo, commit_sha: HEAD_SHA,
            });
            const pr = prs.find(p => p.merged_at) || prs[0];

            if (pr) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: pr.number, body,
              });
            } else if (!ok) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: `Deployment failed for ${HEAD_SHA.slice(0, 7)}`,
                body, labels: ['deploy-failed'],
              });
            }
