{% extends "base.html" %}
{% block content %}
<h1>{{ t("ui_cleanup") }}</h1>
{% if changed %}<p class="notice">{{ t("ui_cleanup_changed") }}</p>{% endif %}
<form method="get" action="/cleanup">
  <label>{{ t("ui_cleanup_text") }}
    <input type="number" name="days" value="{{ days }}" min="1" max="3650">
  </label>
  <button type="submit">{{ t("ui_cleanup_show") }}</button>
</form>
<p>{{ t("ui_cleanup_count", count=count, days=days) }}</p>
{% if count > 0 %}
<p>{{ t("ui_discard_text") }}</p>
<p>{{ plaud_note }}</p>
<form method="post" action="/cleanup">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <input type="hidden" name="days" value="{{ days }}">
  <input type="hidden" name="expected_count" value="{{ count }}">
  <button class="danger" type="submit">{{ t("ui_cleanup_confirm", count=count) }}</button>
</form>
{% endif %}
<p><a href="/">{{ t("ui_back") }}</a></p>
{% endblock %}
