<!doctype html>
<html lang="{{ lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{{ t("oauth_title") }}</title>
<style>
  :root { color-scheme: light dark; --muted: #6b7280; --line: #d1d5db; --danger: #b91c1c; }
  body { font: 16px/1.5 system-ui, sans-serif; margin: 0 auto; max-width: 28rem; padding: 2rem 1rem; }
  input[type=password] { font: inherit; width: 100%; box-sizing: border-box; padding: .5rem; border: 1px solid var(--line); border-radius: .35rem; background: transparent; color: inherit; }
  button { font: inherit; padding: .45rem 1rem; border-radius: .35rem; border: 1px solid var(--line); background: transparent; color: inherit; cursor: pointer; }
  .muted { color: var(--muted); font-size: .9rem; } .error { color: var(--danger); }
  .row { display: flex; gap: .6rem; margin-top: 1rem; }
</style>
</head>
<body>
<h1>{{ t("oauth_title") }}</h1>
<p>{{ t("oauth_intro") }}</p>
<p class="muted">{{ t("oauth_redirect_note", host=redirect_host) }}</p>
{% if error %}<p class="error">{{ t("oauth_wrong_password") }}</p>{% endif %}
<form method="post" action="/authorize">
  <input type="hidden" name="req" value="{{ req }}">
  <input type="hidden" name="sig" value="{{ sig }}">
  <label for="pw">{{ t("oauth_password") }}</label>
  <input id="pw" type="password" name="password" autocomplete="current-password" autofocus required>
  <div class="row">
    <button type="submit" name="action" value="allow">{{ t("oauth_allow") }}</button>
    <button type="submit" name="action" value="deny" formnovalidate>{{ t("oauth_deny") }}</button>
  </div>
</form>
</body>
</html>
