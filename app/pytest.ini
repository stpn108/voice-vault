[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = --ruff
filterwarnings =
    # pytest-testmon 2.1.1 still uses the py.path hook argument, which pytest 8 flags
    # for removal in pytest 9. Harmless while pytest stays pinned; drop with a testmon upgrade.
    ignore:The \(path:pytest.PytestRemovedIn9Warning
    # Starlette 1.x will move its TestClient from httpx to httpx2. httpx stays pinned for the Plaud client.
    ignore:Using `httpx` with `starlette.testclient` is deprecated
markers =
    slow: Long-running tests
    integration: Integration tests (may need external services)
    webapp: Web interface tests
    core: Core application tests
